apiVersion: apps/v1
kind: Deployment
metadata:
  name: nginx-blue
  labels:
    version: blue
    app: nginx
spec:
  replicas: 3
  selector:
    matchLabels:
      version: blue
      app: nginx
  # Pod
  template:
    metadata:
      labels:
        version: blue
        app: nginx
    spec:
      containers:
      - name: nginx
        image: srikanth865/blue-green:0.1.0
        imagePullPolicy: Always
        ports:
        - containerPort: 80
---